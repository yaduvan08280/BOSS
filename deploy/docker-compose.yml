# Production stack. Run from the repo root with:  ./deploy/compose.sh up -d --build
# Data lives under DATA_DIR (default /srv/mono): pg/, uploads/, backups/, rclone/.
name: mono

x-app: &app
  image: mono-server:latest
  restart: unless-stopped
  env_file: ${MONO_ENV_FILE:-../.env}
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://mono:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mono
    UPLOAD_DIR: /data/uploads
  volumes:
    - ${DATA_DIR:-/srv/mono}/uploads:/data/uploads
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mono
      TZ: UTC
    volumes:
      - ${DATA_DIR:-/srv/mono}/pg:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mono -d mono']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # One-shot: apply migrations, then create the first company + owner if it doesn't exist yet.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.server, target: tools }
    image: mono-tools:latest
    env_file: ${MONO_ENV_FILE:-../.env}
    environment: *app-env
    # Also hands the uploads folder to the api user (uid 1000): Docker creates bind folders as root.
    command: ['sh', '-c', 'chown 1000:1000 /data/uploads && npx prisma migrate deploy && node apps/api/dist/seed.js']
    volumes:
      - ${DATA_DIR:-/srv/mono}/uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    <<: *app
    build: { context: .., dockerfile: deploy/Dockerfile.server, target: runtime }
    command: ['node', 'apps/api/dist/main.js']
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'apps/worker/dist/main.js']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$(find /tmp/mono-worker-alive -mmin -2)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { APP_NAME: '${APP_NAME:-MONO}' }
    image: mono-web:latest
    restart: unless-stopped
    ports:
      # Local / LAN access. Cloudflare Tunnel reaches web:80 inside the Docker network.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    profiles: [tunnel]
    logging: *logging

  backup:
    build: { context: .., dockerfile: deploy/Dockerfile.backup }
    image: mono-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: mono
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: mono
      TZ: ${BACKUP_TZ:-Asia/Kolkata}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - ${DATA_DIR:-/srv/mono}/backups:/backups
      - ${DATA_DIR:-/srv/mono}/uploads:/uploads:ro
      - ${DATA_DIR:-/srv/mono}/rclone:/config/rclone
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
