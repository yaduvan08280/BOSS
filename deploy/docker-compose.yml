# Production stack. Run from the repo root with:  ./deploy/compose.sh up -d --build
# Data lives under DATA_DIR (default /srv/mono): pg/, uploads/, backups/, rclone/.
name: mono

x-app: &app
  image: mono-server:latest
  restart: unless-stopped
  env_file: ${MONO_ENV_FILE:-../.env}
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://mono:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mono
    UPLOAD_DIR: /data/uploads
  volumes:
    - ${DATA_DIR:-/srv/mono}/uploads:/data/uploads
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '5' }
  # The app's processes need nothing from the machine: no extra privileges, no way to gain any, and a
  # read-only image — they write only to the uploads folder and a small /tmp kept in memory.
  read_only: true
  tmpfs: ['/tmp:size=256m']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  # Time to finish the requests and jobs in hand before the container is stopped.
  stop_grace_period: 35s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mono
      TZ: UTC
    # Settings for one busy machine (the defaults suit 8 GB and up; PG_SHARED_BUFFERS / PG_CACHE raise them —
    # INSTALL.md). The write-ahead log is archived every minute (deploy/backup/archive-wal.sh): with the nightly
    # base copy, the database can be rebuilt as it was at any minute (deploy/restore-pitr.sh).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_CACHE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      # A statement slower than half a second is written to the log (docker compose logs db).
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      # Tables that change all day are cleaned up and re-measured sooner than the defaults (20 % / 10 %).
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      # A fresh, zero-filled file for each piece: the unused part of a one-minute piece compresses to nothing.
      - -c
      - wal_recycle=off
      - -c
      - wal_init_zero=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
    volumes:
      - ${DATA_DIR:-/srv/mono}/pg:/var/lib/postgresql/data
      - ${DATA_DIR:-/srv/mono}/backups/wal:/wal
      - ./backup/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    shm_size: 1gb
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mono -d mono']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # One-shot: apply migrations, then create the first company + owner if it doesn't exist yet.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.server, target: tools }
    image: mono-tools:latest
    env_file: ${MONO_ENV_FILE:-../.env}
    environment: *app-env
    # Also hands the uploads folder to the api user (uid 1000) and the log archive to the database's user
    # (uid 70 in the postgres image): Docker creates bind folders as root.
    command:
      - sh
      - -c
      - chown 1000:1000 /data/uploads && chown 70:70 /wal && npx prisma migrate deploy && node apps/api/dist/seed.js
    volumes:
      - ${DATA_DIR:-/srv/mono}/uploads:/data/uploads
      - ${DATA_DIR:-/srv/mono}/backups/wal:/wal
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      target: runtime
      args: { APP_VERSION: '${APP_VERSION:-unknown}' }
    command: ['node', 'apps/api/dist/main.js']
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'apps/worker/dist/main.js']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$(find /tmp/mono-worker-alive -mmin -2)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { APP_NAME: '${APP_NAME:-MONO}' }
    image: mono-web:latest
    restart: unless-stopped
    ports:
      # Local / LAN access. Cloudflare Tunnel reaches web:80 inside the Docker network.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api: { condition: service_healthy }
    # The web server only binds port 80 and keeps a little state of its own.
    read_only: true
    tmpfs: ['/tmp', '/data', '/config']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    profiles: [tunnel]
    logging: *logging

  backup:
    build: { context: .., dockerfile: deploy/Dockerfile.backup }
    image: mono-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: mono
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: mono
      TZ: ${BACKUP_TZ:-Asia/Kolkata}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_QUICK_CRON: ${BACKUP_QUICK_CRON:-*/15 * * * *}
      BACKUP_QUICK_KEEP_HOURS: ${BACKUP_QUICK_KEEP_HOURS:-48}
      BACKUP_BASE_KEEP: ${BACKUP_BASE_KEEP:-2}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - ${DATA_DIR:-/srv/mono}/backups:/backups
      - ${DATA_DIR:-/srv/mono}/uploads:/uploads:ro
      # The database's own files, read-only, for the nightly base copy.
      - ${DATA_DIR:-/srv/mono}/pg:/pgdata:ro
      - ${DATA_DIR:-/srv/mono}/rclone:/config/rclone
    security_opt: ['no-new-privileges:true']
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
